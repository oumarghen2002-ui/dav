<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<title>طلب العسل - جمعية AMSKO</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<header>
    <img src="images/logo.png" alt="شعار جمعية AMSKO" class="logo">
    <h1>طلب العسل الطبيعي</h1>
</header>

<main class="container">

    <form id="orderForm">
        <label for="name">الاسم :</label>
        <input type="text" id="name" placeholder="ادخل اسمك" required>

        <label for="phone">الهاتف :</label>
        <input type="text" id="phone" placeholder="ادخل رقم هاتفك" required>

        <label for="honeyType">اختر نوع العسل :</label>
        <select id="honeyType" required>
            <option value="200" data-img="images/seder.jpg" data-price="200">عسل السدر</option>
            <option value="180" data-img="images/lemon.jpg" data-price="180">عسل اليمون</option>
            <option value="150" data-img="images/karbaz.jpg" data-price="150">عسل الكرباز</option>
            <option value="220" data-img="images/zaatar.jpg" data-price="220">عسل الزعتر</option>
            <option value="250" data-img="images/dghmos.jpg" data-price="250">عسل الدغموس</option>
        </select>

        <img id="honeyImage" src="images/seder.jpg" alt="عسل السدر" class="honey-img">

        <p>ثمن الكيلوغرام : <span id="price">200</span> درهم</p>

        <label for="quantity">الكمية (كغ) :</label>
        <input type="number" id="quantity" placeholder="ادخل الكمية التي تريدها" step="0.1" min="0.1" required>

        <p>المجموع : <span id="total">0</span> درهم</p>

        <button type="submit" class="btn">إرسال الطلب</button>
    </form>

</main>

<script src="script.js"></script>
</body>
</html>
