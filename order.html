<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<title>طلب العسل</title>
<link rel="stylesheet" href="style.css">
</head>

<body>

<header>
<img src="images/logo.png" class="logo">
<h1>طلب العسل</h1>
</header>

<div class="container">

<form id="orderForm">

<label>الاسم</label>
<input type="text" id="name" required>

<label>الهاتف</label>
<input type="text" id="phone" required>

<label>اختر نوع العسل</label>

<select id="honeyType">

<option data-img="images/seder.jpg" data-price="200">عسل السدر</option>
<option data-img="images/lemon.jpg" data-price="180">عسل الليمون</option>
<option data-img="images/karbaz.jpg" data-price="150">عسل الكرباز</option>
<option data-img="images/zaatar.jpg" data-price="220">عسل الزعتر</option>
<option data-img="images/dghmos.jpg" data-price="250">عسل الدغموس</option>

</select>

<img id="honeyImage" class="honey-img">

<p>ثمن الكيلوغرام : <span id="price"></span> درهم</p>

<label>الكمية (كغ)</label>
<input type="number" id="quantity" min="1">

<p class="total">المجموع : <span id="total">0</span> درهم</p>

<p class="payment">الدفع عند الاستلام</p>

<button type="submit">إرسال الطلب</button>

</form>

</div>

<script src="script.js"></script>

</body>
</html>

</main>

<script src="script.js"></script>
</body>
</html>
