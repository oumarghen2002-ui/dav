<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<title>طلب العسل - جمعية AMSKO</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<header>
    <img src="images/logo.png" alt="شعار جمعية AMSKO" class="logo">
    <h1>طلب العسل - جمعية AMSKO</h1>
</header>

<main class="container">

    <div class="order-section">
        <label for="honeyType"><h3>اختر نوع العسل :</h3></label>
        <select id="honeyType">
            <option value="200" data-img="images/seder.jpg" data-price="200">عسل السدر</option>
            <option value="180" data-img="images/lemon.jpg" data-price="180">عسل اليمون</option>
            <option value="150" data-img="images/karbaz.jpg" data-price="150">عسل الكرباز</option>
            <option value="220" data-img="images/zaatar.jpg" data-price="220">عسل الزعتر</option>
        </select>

        <img id="honeyImage" src="images/seder.jpg" alt="عسل السدر" class="honey-img">

        <p>ثمن الكيلوغرام : <span id="price">200</span> درهم</p>
        <p class="payment-info">الدفع عند الاستلام</p>

        <form id="orderForm">
            <label for="name">الاسم :</label>
            <input type="text" id="name" placeholder="اسمك" required>

            <label for="phone">الهاتف :</label>
            <input type="text" id="phone" placeholder="رقم هاتفك" required>
            
            <label for="quantity">الكمية (بالكغ) :</label>
            <input type="number" id="quantity" placeholder="أدخل الكمية التي تريدها" step="0.1" min="0.1" required>

            <p>المجموع : <span id="total">0</span> درهم</p>

            <button type="submit">إرسال الطلب</button>
        </form>
    </div>

</main>

<script src="script.js"></script>
</body>
</html>
