<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Coopérative AMSKO - Vente de miel</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<h1>🍯 Coopérative AMSKO</h1>
<h2>Commander du miel naturel</h2>

<div class="product">
    <h3>Choisir le type de miel</h3>

    <label for="honeyType">Type de miel :</label>
    <select id="honeyType">
        <option value="150">Miel d'oranger - 150 DH/kg</option>
        <option value="200">Miel de thym - 200 DH/kg</option>
        <option value="180">Miel de fleurs - 180 DH/kg</option>
    </select>

    <p>Prix : <span id="price">150</span> DH</p>

    <form id="orderForm">
        <input type="text" id="name" placeholder="Votre nom" required>
        <input type="text" id="phone" placeholder="Votre téléphone" required>
        <input type="number" id="quantity" placeholder="Quantité" required>
        <button type="submit">Commander</button>
    </form>
</div>

<script src="script.js"></script>
</body>
</html>
