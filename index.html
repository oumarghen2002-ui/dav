<!DOCTYPE html>
<html lang="ar">

<head>
<meta charset="UTF-8">
<title>جمعية AMSKO</title>
<link rel="stylesheet" href="style.css">
</head>

<body>

<header>
    <img src="images/logo.png" class="logo">
    <h1>جمعية AMSKO</h1>
    <h2>بيع العسل الطبيعي</h2>
</header>

<section class="products">

    <div class="product">
        <img src="images/seder.jpg">
        <h3>عسل السدر</h3>
        <p class="price">200 DH/Kg</p>
    </div>

    <div class="product">
        <img src="images/lemon.jpg">
        <h3>عسل الليمون</h3>
        <p class="price">180 DH/Kg</p>
    </div>

    <div class="product">
        <img src="images/karbaz.jpg">
        <h3>عسل الكرباز</h3>
        <p class="price">150 DH/Kg</p>
    </div>

    <div class="product">
        <img src="images/zaatar.jpg">
        <h3>عسل الزعتر</h3>
        <p class="price">220 DH/Kg</p>
    </div>

    <div class="product">
        <img src="images/dghmos.jpg">
        <h3>عسل الدغموس</h3>
        <p class="price">250 DH/Kg</p>
    </div>

</section>

<div class="order-section">
    <a href="order.html" class="order-button">طلب العسل</a>
</div>

</body>
</html>
