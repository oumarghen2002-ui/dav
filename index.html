<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Coopérative AMSKO - Vente de miel</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<h1>🍯 Coopérative AMSKO</h1>
<h2>Commander du miel naturel</h2>

<div class="product">
    <h3>Choisir le type de miel</h3>

    <label for="honeyType">نوع العسل :</label>
    <select id="honeyType">
        <option value="200">عسل السدر - 200 DH/kg</option>
        <option value="180">عسل اليمون - 180 DH/kg</option>
        <option value="150">عسل الكرباز - 150 DH/kg</option>
        <option value="220">عسل الزعتر - 220 DH/kg</option>
    </select>

    <p>ثمن الكيلوغرام : <span id="price">200</span> DH</p>

    <form id="orderForm">
        <input type="text" id="name" placeholder="Votre nom" required>
        <input type="text" id="phone" placeholder="Votre téléphone" required>
        
        <label for="quantity">الكمية :</label>
        <select id="quantity" required>
            <option value="0.5">0.5 kg</option>
            <option value="1">1 kg</option>
            <option value="1.5">1.5 kg</option>
            <option value="2">2 kg</option>
            <option value="2.5">2.5 kg</option>
            <option value="3">3 kg</option>
            <option value="3.5">3.5 kg</option>
            <option value="4">4 kg</option>
            <option value="4.5">4.5 kg</option>
            <option value="5">5 kg</option>
        </select>

        <button type="submit">Commander</button>
    </form>
</div>

<script src="script.js"></script>
</body>
</html>
