<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<title>جمعية AMSKO - بيع العسل</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<h1>🍯 جمعية AMSKO</h1>
<h2>طلب العسل الطبيعي</h2>

<div class="product">
    <h3>اختر نوع العسل</h3>

    <!-- Photos des types de miel -->
    <img id="honeyImage" src="seder.jpg" alt="عسل السدر">

    <label for="honeyType">نوع العسل :</label>
    <select id="honeyType">
        <option value="200" data-img="seder.jpg">عسل السدر - 200 درهم/كغ</option>
        <option value="180" data-img="lemon.jpg">عسل اليمون - 180 درهم/كغ</option>
        <option value="150" data-img="karbaz.jpg">عسل الكرباز - 150 درهم/كغ</option>
        <option value="220" data-img="zaatar.jpg">عسل الزعتر - 220 درهم/كغ</option>
    </select>

    <p>ثمن الكيلوغرام : <span id="price">200</span> درهم</p>
    <p class="payment-info">الدفع عند الاستلام</p>

    <form id="orderForm">
        <label for="name">الاسم :</label>
        <input type="text" id="name" placeholder="اسمك" required>

        <label for="phone">الهاتف :</label>
        <input type="text" id="phone" placeholder="رقم هاتفك" required>
        
        <label for="quantity">الكمية (بالكغ) :</label>
        <input type="number" id="quantity" placeholder="أدخل الكمية التي تريدها" step="0.1" min="0.1" required>

        <button type="submit">طلب</button>
    </form>
</div>

<script src="script.js"></script>
</body>
</html>
