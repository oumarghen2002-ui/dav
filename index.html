<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<title>جمعية AMSKO - بيع العسل</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<h1>🍯 جمعية AMSKO</h1>
<h2>طلب العسل الطبيعي</h2>

<div class="product">
    <h3>اختر نوع العسل</h3>

    <label for="honeyType">نوع العسل :</label>
    <select id="honeyType">
        <option value="200">عسل السدر - 200 درهم/كغ</option>
        <option value="180">عسل اليمون - 180 درهم/كغ</option>
        <option value="150">عسل الكرباز - 150 درهم/كغ</option>
        <option value="220">عسل الزعتر - 220 درهم/كغ</option>
    </select>

    <p>ثمن الكيلوغرام : <span id="price">200</span> درهم</p>

    <form id="orderForm">
        <input type="text" id="name" placeholder="اسمك" required>
        <input type="text" id="phone" placeholder="رقم هاتفك" required>
        
        <label for="quantity">الكمية (بالكغ) :</label>
        <input type="number" id="quantity" placeholder="ادخل الكمية التي تريدها" step="0.1" min="0.1" required>

        <button type="submit">طلب</button>
    </form>
</div>

<script src="script.js"></script>
</body>
</html>
